services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: logicore
      POSTGRES_USER: logicore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique database password}
    volumes:
      - logicore-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U logicore -d logicore"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/logicore
      POSTGRES_USER: logicore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set the administrator email}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a unique administrator password}
      SESSION_SECURE: ${SESSION_SECURE:-false}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8098}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8098}:80"
    depends_on:
      - backend
volumes:
  logicore-data:
