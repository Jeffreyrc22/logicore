server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 client_max_body_size 11m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 location /api/ {proxy_pass http://backend:8090;proxy_set_header Host $host;proxy_set_header X-Forwarded-Proto $scheme;}
 location /swagger-ui/ {proxy_pass http://backend:8090;}
 location /v3/api-docs {proxy_pass http://backend:8090;}
 location / {try_files $uri $uri/ /index.html;}
}
