server:
  port: ${APP_PORT:8090}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: LOGICORE_SESSION
        http-only: true
        secure: ${SESSION_SECURE:false}
        same-site: lax
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:55432/logicore}
    username: ${POSTGRES_USER:logicore}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  public-url: ${PUBLIC_URL:http://127.0.0.1:4200}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:}
